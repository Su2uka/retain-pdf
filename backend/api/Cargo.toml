[package]
# 包名 2026-10-16 从 `rust_api` 改成 `retain-pdf-api`（库的 crate 名随之是 `retain_pdf_api`）。
# 可执行文件名不变，仍是 `rust_api`：Docker 的 entrypoint-app.sh、桌面版打包脚本、
# ops/development/dev_stack.py 和 CI 的 desktop 打包都按这个名字找它。
name = "retain-pdf-api"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "rust_api"
path = "src/main.rs"

[dependencies]
retain-pdf-api-base = { path = "../packages/retain-pdf-api-base" }
retain-pdf-accounts = { path = "../packages/retain-pdf-accounts" }
retain-pdf-ai = { path = "../packages/retain-pdf-ai" }
retain-pdf-core = { path = "../packages/retain-core" }
retain-pdf-files = { path = "../packages/retain-pdf-files" }
retain-pdf-glossaries = { path = "../packages/retain-pdf-glossaries" }
retain-pdf-ingest = { path = "../packages/retain-pdf-ingest" }
retain-pdf-jobs = { path = "../packages/retain-pdf-jobs" }
retain-pdf-library = { path = "../packages/retain-pdf-library" }
retain-pdf-platform = { path = "../packages/retain-pdf-platform" }
retain-pdf-providers = { path = "../packages/retain-pdf-providers" }
retain-pdf-data = { path = "../packages/retain-data" }
retain-pdf-config = { path = "../packages/retain-config" }
retain-pdf-runner = { path = "../packages/retain-jobs" }
retain-pdf-proc = { path = "../packages/retain-proc" }
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
once_cell = "1"
mime_guess = "2"
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
lopdf = "0.32"
fastrand = "2"
libc = "0.2"
csv = "1"
base64 = "0.22"
url = "2"
httpdate = "1"
# fx 终端的 WebSocket 代理：浏览器 → rust_api → ai_service。
# axum 的 ws 只管服务端那一半，连出去要客户端实现。
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }
sha2 = "0.11.0"
hmac = "0.13"
getrandom = "0.2"
argon2 = "0.5"
serde_urlencoded = "0.7"
futures-util = "0.3"

[dev-dependencies]
retain-pdf-api-base = { path = "../packages/retain-pdf-api-base", features = ["test-fixtures"] }
retain-pdf-ai = { path = "../packages/retain-pdf-ai", features = ["test-fixtures"] }
retain-pdf-ingest = { path = "../packages/retain-pdf-ingest", features = ["test-fixtures"] }
retain-pdf-jobs = { path = "../packages/retain-pdf-jobs", features = ["test-fixtures"] }
tower = { version = "0.5", features = ["util"] }
