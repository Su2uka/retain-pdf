[package]
name = "retainpdf-glossaries"
version = "0.1.0"
edition = "2021"
description = "术语表：增删改查、CSV 导入导出、建任务时解析任务用的术语"

[dependencies]
retainpdf-api-base = { path = "../retainpdf-api-base" }
retainpdf-core = { path = "../retainpdf-core" }
retainpdf-data = { path = "../retainpdf-data" }
chrono = { version = "0.4", features = ["serde", "clock"] }
csv = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
fastrand = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
