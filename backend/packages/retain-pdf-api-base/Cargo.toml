[package]
name = "retain-pdf-api-base"
version = "0.1.0"
edition = "2021"
description = "API 各领域包共用的底座：错误类型 AppError 和按编号读出任务（job_loading）"

[dependencies]
retain-pdf-core = { path = "../retain-core" }
retain-pdf-data = { path = "../retain-data" }
anyhow = "1"
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
