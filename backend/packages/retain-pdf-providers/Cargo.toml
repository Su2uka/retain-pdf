[package]
name = "retain-pdf-providers"
version = "0.1.0"
edition = "2021"
description = "服务商：凭据库、模型调用、服务商连通性和额度探测"

[dependencies]
retain-pdf-api-base = { path = "../retain-pdf-api-base" }
retain-pdf-core = { path = "../retain-core" }
retain-pdf-data = { path = "../retain-data" }
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde", "clock"] }
fastrand = "2"
futures-util = "0.3"
getrandom = "0.2"
libc = "0.2"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"

