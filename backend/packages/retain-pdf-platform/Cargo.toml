[package]
name = "retain-pdf-platform"
version = "0.1.0"
edition = "2021"
description = "平台：多设备同步、数据库备份、字体、健康检查"

[dependencies]
retain-pdf-api-base = { path = "../retain-pdf-api-base" }
retain-pdf-core = { path = "../retain-core" }
retain-pdf-data = { path = "../retain-data" }
retain-pdf-db = { path = "../../../database/retain-db" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
walkdir = "2"
