[package]
name = "retain-pdf-files"
version = "0.1.0"
edition = "2021"
description = "文件（出口）：产物清单和打包、派生产物生成、下载文件名"

[dependencies]
retain-pdf-api-base = { path = "../retain-pdf-api-base" }
retain-pdf-core = { path = "../retain-core" }
retain-pdf-data = { path = "../retain-data" }
fastrand = "2"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
