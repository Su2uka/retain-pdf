[package]
name = "retain-pdf-ingest"
version = "0.1.0"
edition = "2021"
description = "入口：上传 PDF（校验、页数、修复、落盘）"

[features]
# 测试用的 PDF 生成函数；rust_api 的 dev-dependencies 打开它，生产构建不带。
test-fixtures = []

[dependencies]
retain-pdf-accounts = { path = "../retain-pdf-accounts" }
retain-pdf-api-base = { path = "../retain-pdf-api-base" }
retain-pdf-core = { path = "../retain-core" }
retain-pdf-data = { path = "../retain-data" }
fastrand = "2"
lopdf = "0.32"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
