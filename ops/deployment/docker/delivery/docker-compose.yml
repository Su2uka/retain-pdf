name: retainpdf

services:
  app:
    image: ${APP_IMAGE:-wxyhgk/retainpdf-app:latest}
    restart: unless-stopped
    env_file:
      - ./docker/app.env
    environment:
      # 占位 key 换成第一次启动随机生成的，存在这个目录，web 容器读同一份。
      RETAINPDF_SHARED_KEY_DIR: /run/retainpdf-key
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-41000}:41000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${APP_SIMPLE_PORT:-42000}:42000"
    volumes:
      - app_data:/data
      - api_key:/run/retainpdf-key
      - ./docker/auth.local.json:/app/services/api/auth.local.json:ro
    healthcheck:
      # Readiness includes the database and every supervised runtime.  The
      # liveness endpoint intentionally remains 200 while degraded, so using
      # /health here would release dependent services before app is usable.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-wxyhgk/retainpdf-web:latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./docker/web.env
    environment:
      RETAINPDF_SHARED_KEY_DIR: /run/retainpdf-key
    volumes:
      - api_key:/run/retainpdf-key:ro
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-40001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  api_key:
