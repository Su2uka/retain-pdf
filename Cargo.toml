[workspace]
resolver = "2"
members = [
  "database/retain-db",
  "backend/api",
  "backend/cli",
  "backend/jobs",
  "backend/packages/retain-config",
  "backend/packages/retain-pdf-api-base",
  "backend/packages/retain-pdf-accounts",
  "backend/packages/retain-pdf-ai",
  "backend/packages/retain-pdf-ingest",
  "backend/packages/retain-pdf-jobs",
  "backend/packages/retain-pdf-library",
  "backend/packages/retain-pdf-files",
  "backend/packages/retain-pdf-glossaries",
  "backend/packages/retain-pdf-platform",
  "backend/packages/retain-pdf-providers",
  "backend/packages/retain-core",
  "backend/packages/retain-data",
  "backend/packages/retain-jobs",
  "backend/packages/retain-proc",
]

# 调试构建里第三方库（serde_json、sha2、图像 / PDF 处理……）也开优化：开发栈跑的是调试构建，
# 未优化的 JSON 解析和哈希比发布构建慢十倍，接口实测被拖到几百毫秒。只影响依赖，
# 我们自己的代码照旧不优化、可调试；代价是第一次全量编译依赖慢一些。
[profile.dev.package."*"]
opt-level = 2
